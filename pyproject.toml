[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lifts"
version = "0.1.0"
description = "Latent imputation for time series with optional encoder calibration"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "LIFTS maintainers" }]
keywords = ["time-series", "imputation", "probabilistic", "pytorch", "state-space-model"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.24",
  "matplotlib>=3.5",
  "torch",
]

[project.optional-dependencies]
test = [
  "pytest>=7.4,<9",
]
notebook = [
  "ipykernel>=6.25,<7",
  "jupyterlab>=4,<5",
]
dev = [
  "build>=1.2",
  "pytest>=7.4,<9",
  "twine>=5.0",
]

[project.urls]
Homepage = "https://github.com/sanyouwu/lifts"
Repository = "https://github.com/sanyouwu/lifts"
Issues = "https://github.com/sanyouwu/lifts/issues"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["utils"]

[tool.setuptools.packages.find]
where = ["src"]
